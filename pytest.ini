[pytest]
# A-001: 修复全量 pytest 收集失败
# - testpaths=tests：全量只收集本项目 tests/，不递归 config/skills/ 下第三方技能库的测试
#   （417 个技能目录中的 scripts/core.py 会抢占 "core" 模块名，导致 "core is not a package"）
# - 技能库自带测试仍可单独跑：py -m pytest config/skills/skill-comply
testpaths = tests
norecursedirs = config skills data docs Knowledge BGE-M3 llama.cpp social gui
# 固定 basetemp，绕开 %TEMP%\pytest-of-<user>\pytest-current：
# 该软链一旦损坏成悬空 reparse point，_pytest/pathlib.py:356 cleanup_dead_symlinks
# 会抛 PermissionError: [WinError 5]，测试全绿也过不了门禁。
# 指定后 pytest 走 tmpdir.py:154 分支，不再创建/清理 pytest-NNN 与 pytest-current。
#
# ⚠️ 这只是「不经 qa.py 直接跑 pytest」时的兜底默认值，且**只对单进程安全**：
#   _pytest/tmpdir.py:157 在 getbasetemp() 里对给定 basetemp 先 rm_rf 整棵目录树，
#   两个进程共用一个 basetemp 必然互删（并发跑 → 大量 tmp_path 用例 failed）。
#   并发运行必须各自传唯一值：qa.py 的 pytest 阶段用命令行 --basetemp=data/pytest_tmp/qa-<pid>-<时间戳>
#   覆盖这里（命令行参数排在 addopts 之后、后者被覆盖，见 _pytest/config/__init__.py:1560），
#   阶段结束即删。所以子目录名 direct = 直跑入口，qa- 前缀 = qa.py 独占入口，互不干扰。
addopts = --basetemp=data/pytest_tmp/direct
# A-033: 精确忽略 starlette.testclient 的 httpx 弃用警告（消息+类别双匹配，不装 httpx2——
# httpx2 是独立新包，仅为一条弃用提示引入新依赖不值；TestClient 仅弃用未移除，功能正常）
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning
