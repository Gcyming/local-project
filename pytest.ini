[pytest]
# A-001: 修复全量 pytest 收集失败
# - testpaths=tests：全量只收集本项目 tests/，不递归 config/skills/ 下第三方技能库的测试
#   （417 个技能目录中的 scripts/core.py 会抢占 "core" 模块名，导致 "core is not a package"）
# - 技能库自带测试仍可单独跑：py -m pytest config/skills/skill-comply
testpaths = tests
norecursedirs = config skills data docs Knowledge BGE-M3 llama.cpp social gui
# A-033: 精确忽略 starlette.testclient 的 httpx 弃用警告（消息+类别双匹配，不装 httpx2——
# httpx2 是独立新包，仅为一条弃用提示引入新依赖不值；TestClient 仅弃用未移除，功能正常）
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning
