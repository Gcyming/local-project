name: ios-icon-gen
version: '1.0'
description: Generate iOS app icons as PNG imagesets for Xcode asset catalogs from
  SF Symbols (5000+ Apple-native) or Iconify API (275k+ open source icons from 200+
  collections). Use when generating icons, creating icon assets, adding icons to asset
  catalog, or searching for icons for iOS projects.
permissions:
  read: true
  write: false
  terminal: false
  network: false
tags: []
