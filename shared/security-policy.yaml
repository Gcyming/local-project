# shared/security-policy.yaml — 安全策略单一真相源（双栈共用）
#
# 背景：此前 TS 侧（core-ts/src/tools/classifier.ts）与 Python 侧（tools/builtin.py）
# 各自维护一份"受保护目录 / 敏感文件"清单，双端漂移导致主链路缺失引擎源码写入保护。
# 本文件为唯一来源，由 scripts/gen_security_policy.py 生成：
#   - shared/gen/security-policy.ts  （Node / Electron 主链路）
#   - shared/gen/security-policy.py  （Python 服务端 / CLI 形态）
# 生成物禁止手改；改这里后重跑生成器。
#
# 口径：清单命中的写入一律拒绝（block），不进入审批——防社工绕过。

# ① 受保护源码目录（相对 slime 安装/项目根；**根外同名目录不判定**，避免误伤用户工作区）
protected_dirs:
  - core-ts        # TS 引擎（调度/沙箱/工具轮）
  - core           # Python 引擎（服务端/CLI 形态）
  - tools          # 工具注册表与内置工具
  - social         # 社交接入
  - sidecar        # 推理 / SILAM 自研脑
  - shared         # 双端契约单源（openapi.yaml + 生成物）
  - gateway-ts     # HTTP 薄壳
  - config         # 加密配置
  - configs        # 词表等配置
  - scripts        # 构建/生成/部署脚本
  - gui            # Electron 主进程与渲染层（宿主）
  - linux          # Linux 部署子项目
  - windows        # Windows 部署子项目
  - runtime        # 内置运行时
  - skills         # 技能库
  - tests          # 测试基线（篡改测试=篡改验收标准）
  - .git           # 版本历史

# ④ 受保护目录的**豁免子路径**（相对 slime 根；命中即不受上面的 protected_dirs 约束）
#
# 背景（2026-10-07 实测缺陷 = 用户报的「造不了扩展」+「总是被拒绝」）：
#   protected_dirs 原本是给**源码目录**写的（core-ts / gui / tools …装的都是代码），
#   但打包形态下 slime 根就是**运行时数据根**（%APPDATA%\slime-gui\slime-data），
#   于是 `config`（本意保护 config/agents.json 等主配置）把
#   `config/skills`（技能）与 `config/plugins`（插件）**一起封**了 ——
#   创造模式的导引明确要求 Agent 往这两个目录写，写入却是 block 级硬规则，
#   **任何审批档位/开关都批不了**，用户侧就只会看到一句「被拒绝」。
#
# 放行口径（三条缺一不可，改动前先自问）：
#   · 只放**目录及其下全部子路径**，且必须写全相对路径（不许只写 `config`）；
#   · 这两个目录里只放 **Markdown 指令 + JSON 清单**（无可执行代码、无入口可被 require/import）；
#   · 真正要保护的主配置（slime.toml / agents.json / *.enc）由 sensitive_filenames
#     与 write_block_suffixes **继续拦着**，本豁免**不放开**它们。
protected_path_exemptions:
  - config/skills       # 技能库：SKILL.md + manifest.yaml
  - config/plugins      # 扩展容器：plugin.json + skills/

# ⑤ 贡献资产的**归属口径**（配合 §④ 使用；A-1197 收口）
#
# 背景（§④ 整目录豁免带来的副作用）：豁免放行了 config/plugins 与 config/skills
# **整目录**，于是「任何 Agent 都能改任何一个插件/技能目录」—— 包括改别人的、
# 以及在 config/plugins 下**新建一个与内置插件同名的目录**（后者会让同名清单重复
# 而装载失败，等于变相把内置能力下线）。后面还有更大的能力扩展在排队，
# 暴露面只会变大，所以在这里收紧。
#
# 判据（判在**资产目录**这一层，不是文件层；三个键合起来才是一条完整判据）：
#   ① 资产目录**在磁盘上还不存在** ⇒ 放行（这就是「新建」）；
#   ② 已存在 ⇒ 只有它的来源标记声明自己是 agent 自建时才放行（这就是「迭代自己刚建的那个」）；
#   ③ 资产目录整体命中 contribution_reserved_assets ⇒ 永不放行（内置插件同名目录）。
# 标记文件名/字段/取值都放在这里，双端从同一份生成，避免「谁认哪个字段」双端漂移。
#
# ⚠️ 失效场景（改动前必读 —— 这三条是**已知且刻意接受**的，不是没想清楚）：
#   · 这是**来源归属**，不是**会话归属**：另一个创造模式 Agent 仍能改这个 Agent 建的目录。
#     真按会话隔离要把 sessionId/agentName 铺到 hardRuleCheck，而那条调用链在
#     core-ts/src/tool_loop.ts 与 core-ts/src/services/** —— 本轮不在改动范围内。
#     本仓在 hardRuleCheck 拿到的只有 {name, riskKind, target, projectRoot}，无身份可用。
#   · 标记字段由写方自己填，理论上可伪造；但要写进某个目录必须先通过 ①/②
#     （目录不存在，或已是自己声明的资产），所以「伪造标记」不构成提权。
#     真正与标记无关的口子是 ③（目录名），它对新建目录同样生效。
#   · 已存在的**空目录**（无任何标记文件）按 ① 放行 —— 与「先 mkdir 再写」等价；
#     空目录在装载器眼里根本不是资产（无 plugin.json 直接跳过），不构成越权。
contribution_reserved_assets:      # ③ 永不放行的资产目录（写全相对路径，含 / 边界）
  - config/plugins/subagent
  - config/plugins/file-io
  - config/plugins/doc-authoring
  - config/plugins/shell-exec
  - config/plugins/web-access
  - config/plugins/user-interaction
  - config/plugins/planning
  - config/plugins/memory
  - config/plugins/android-device
  - config/plugins/http-service
  - config/plugins/sidebar
  - config/plugins/screen-control
  - config/plugins/browser
  - config/plugins/skill-instructions
  - config/plugins/doc-parsing
  - config/plugins/office-render
  - config/plugins/online-search
  - config/plugins/mind
  - config/plugins/silam
  - config/plugins/local-model
  - config/plugins/sandbox
  - config/plugins/terminal-shell
  - config/plugins/social
  - config/plugins/multi-agent
  - config/plugins/guardrails
  - config/plugins/encryption
  - config/plugins/observability
  - config/plugins/model-routing
  - config/plugins/mcp-bridge
  - config/plugins/plugin-management
contribution_owner_markers:       # ② 读取来源声明的候选文件名（按扩展名决定解析方式）
  - plugin.json                   # 插件清单（JSON）
  - manifest.yaml                 # 技能清单（YAML）
  - manifest.json                 # 技能清单（JSON）
  - SKILL.md                      # 技能正文 frontmatter（YAML 形态）
contribution_owner_field: origin
contribution_owner_value: agent

# ② 敏感文件名（写 → block；大小写不敏感比对）
sensitive_filenames:
  - .slime_pass          # passphrase
  - providers.enc.json   # 加密供应商凭据
  - auth_token.enc
  - auth_token.json
  - slime.toml           # 主配置（含功能开关/MCP/沙箱参数）
  - agents.json          # Agent 注册表
  - global_config.json
  - history.jsonl        # 会话历史
  - audit.jsonl          # 审计日志（安全事件溯源）
  - .git/config
  - passphrase
  - password
  - id_rsa
  - id_ed25519
  - slime_server.py    # 服务端入口（引擎代码）
  - slime_cli.py       # CLI 入口（引擎代码）
  - slime_launcher.py  # 启动器
  - requirements.txt   # 依赖锁定
  - qa.py              # QA 门禁（篡改=篡改验收标准）
  - run_tests.py
  - pytest.ini

# ③ 写入阻断后缀——分两种场景，口径刻意不同：
#   write_block_suffixes          引擎锚定写入（file_write 工具；TS builtin 与 Python builtin 共用）
#                                 含 .toml：slime 自身配置多为 toml，且写入锚定项目根
#   classifier_write_block_suffixes  工作区写入（classifier 审批判定；Agent 操作用户项目）
#                                 刻意不含 .toml，否则会阻断用户项目里 pyproject.toml 等合法写入
write_block_suffixes:
  - .enc
  - .toml
  - .key
  - .pem
  - .p12
  - .pfx
classifier_write_block_suffixes:
  - .enc
  - .key
  - .pem
  - .p12
  - .pfx
