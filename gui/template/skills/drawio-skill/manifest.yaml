name: drawio-skill
version: '1.0'
description: Create, edit, synchronize, inspect, test, and publish editable draw.io diagrams (architecture / ERD / UML / sequence / C4 / BPMN / network / ML / infra). Also converts code, IaC, SQL, OpenAPI, AsyncAPI, Protobuf and GraphQL into diagrams, and can query, review, diff, restyle or sync an existing diagram.
# ⚠️ 溯源如实声明：scripts/ 下的 Python 会 spawn drawio / dot(tred) / git（全部 argv 调用，无 shell=True），
#    并经 https + 主机白名单（unpkg.com / cdn.simpleicons.org）下载品牌图标。当前 skill 引擎已禁用
#    skill.py 执行，故这些权限**尚不被消费**；如实声明是为了将来若重启脚本执行能走 L3/L4 审批。
permissions:
  read: true
  write: true
  terminal: true
  network: true
tags: []
source: https://github.com/Agents365-ai/drawio-skill
license: MIT
