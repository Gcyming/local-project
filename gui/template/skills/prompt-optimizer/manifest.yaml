name: prompt-optimizer
version: '1.0'
description: 'Analyze raw prompts, identify intent and gaps, match ECC components
  (skills/commands/agents/hooks), and output a ready-to-paste optimized prompt. Advisory
  role only — never executes the task itself. TRIGGER when: user says "optimize prompt",
  "improve my prompt", "how to write a prompt for", "help me prompt", "rewrite this
  prompt", or explicitly asks to enhance prompt quality. Also triggers on Chinese
  equivalents: "优化prompt", "改进prompt", "怎么写prompt", "帮我优化这个指令". DO NOT TRIGGER when:
  user wants th'
permissions:
  read: true
  write: false
  terminal: false
  network: false
