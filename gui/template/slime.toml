# slime 配置文件 —— 打包发行模板（无任何开发机密 / 开发机路径）。
# 本文件随安装包分发（extraFiles），首启由 boot.ts 引导到用户数据目录并在其上做路径矫正：
#   - llama_bin  → 安装根内自带的 llama-server（存在时始终跟随安装根）
#   - model_path / models_dir → 用户按需下载到的 models/（旧值所指文件不存在时才矫正）
# 模型不入安装包：models 落点指向 SLIME_ROOT 下可写目录。
# 所有空路径都会在首次启动被改写为包内资源或用户数据目录，无需手工填写。

[memory]
# 记忆系统开关
enabled = true
# 存储目录（相对项目根，支持绝对路径）
dir = "Knowledge/Agent Memory"
# 分类枚举（混合分类体系：固定主类 + 自由标签）
categories = ["fact", "preference", "lesson", "rule", "skill", "insight", "user_profile"]
# 存储后端: "json" | "lancedb"
# 说明: 实际启用开关为下方 [memory.lancedb].enabled（server 仅检查该字段）
# backend 字段仅记录存储后端语义，供文档/状态展示使用
backend = "lancedb"
# LanceDB 可选配置（enabled=true 即生效）
[memory.lancedb]
enabled = true
uri = ""  # 默认 data/{agent_id}/lancedb

[evolve]
# 演化引擎开关
enabled = true
# 遗忘阈值（天），超过此天数未交互的 trait 可能被遗忘
forget_threshold_days = 30

[context]
# 上下文压缩配置
# 保留开头 N 条完整对话
head = 3
# 保留结尾 M 条完整对话
tail = 10
# 超过此阈值触发压缩
window = 30

[social]
# 企业微信 webhook URL
wechat_webhook_url = ""
# 企业微信回调 verify_token（空=拒绝验签，填入即启用 SHA1 校验）
wechat_verify_token = ""
# 个人微信桥接服务地址（N10-L2）
wechat_bridge_url = ""
# 桥接服务认证 token
wechat_bridge_token = ""

# ── 沙箱配置 ──────────────────────────────────────────────

[sandbox]
# 全局默认策略: strict | moderated | relaxed
default_level = "strict"

# 工作目录隔离（空字符串=不限制）
workspace = ""

# 默认批准策略
auto_approve_levels = [0, 1]    # L0/L1 自动批准
require_approval_levels = [2, 3, 4]  # L2-L4 需确认
deny_levels = [5]               # L5 强制拒绝

# 工具级自动批准名单（A-002：支持 fnmatch 通配，如 "mcp_browser_*"）
# MCP 工具缺省权限 network（L4），server 模式没有交互确认通道；
# 不在此名单内的 L2-L4 工具会被沙箱拒绝（fail-closed）。
# "mcp_*" 放行所有 MCP 桥接工具 —— 范围已被用户侧 [[mcp_servers]] 显式配置约束
# （只有配置里列出的服务器才会桥接）。如需收紧可改为具体前缀如 "mcp_browser_*"。
# 注意（A-088 漏洞清单 P1-9）：mcp_* 通配仅自动批准 read/write（L0-2），
# network/terminal 级 MCP 工具（缺省 network=L4）仍需确认/拒绝。
# "agnes_*" 放行同厂媒体生成工具（用户定制：agnes_generate_image 等，
# 密钥来自环境变量或加密 providers，不落明文）。
# "file_write" 放行受控本地文件写入（A-041：仅项目根内/敏感文件屏蔽/5MB 上限）。
# Agent 级 sandbox_override 与本名单取并集（互不覆盖）。
auto_approve_tools = ["web_fetch", "web_search", "mcp_*", "agnes_*", "file_write", "file_read", "file_list", "skill_*"]

# 子 Agent 默认配置
[sandbox.child_default]
inherit_from_parent = true
timeout_seconds = 300
max_concurrent_permissions = 10

# 异常行为检测
[sandbox.anomaly_detection]
enabled = true
write_rate_limit = 100      # 次/分钟
file_size_limit_mb = 50
suspicious_patterns = [
    "rm -rf /",
    "chmod 777",
    "curl | bash",
]

# 审计日志
[sandbox.audit]
enabled = true
log_path = "data/audit.jsonl"
retention_days = 90

# ── 本地模型管理 ──────────────────────────────────────────
# 空路径在首启由 boot.ts 矫正：llama_bin → 安装根自带二进制；model_path/models_dir → 用户下载目录。

[model_server]
llama_bin = ""
startup_timeout = 60
vram_budget_gb = 7.0
chat_est_gb = 4.0

[model_server.embedding]
model_path = ""
port = 8999
gpu_layers = 99
ctx_len = 2048
persistent = true
dim = 1024

[model_server.chat]
models_dir = ""
port_start = 18082
gpu_layers = 99
ctx_len = 8192
persistent = false
idle_unload_min = 10
max_instances = 1

# ── MCP 服务器配置 ──────────────────────────────────────────
# 每个 [[mcp_servers]] 定义一个 MCP Server，两种传输二选一：
#   stdio：command + args（本地子进程）
#   HTTP：url + headers（远程 Streamable HTTP，MCP 2025 规范）
# 工具/资源/提示分别桥接为 mcp_ / mcp_res_ / mcp_prompt_ 前缀工具
# 可选字段 timeout（秒，默认 30）
# 可选字段 tool_permissions：按 server 覆写工具权限（缺省 MCP 工具 = network）
# 可选字段 inject_provider_keys：注入 LLM key 给第三方子进程（P1-10 最小权限）
# 发行版默认不内置任何 MCP server（避免携带开发机路径 / 凭据），请在「设置 → MCP」中添加。

# 本地 stdio 示例（在用户侧配置界面添加）：
# [[mcp_servers]]
# name = "filesystem"
# command = "npx"
# args = ["-y", "@anthropic-ai/mcp-server-filesystem", "<你的工作目录>"]

# 远程 HTTP 示例：
# [[mcp_servers]]
# name = "github"
# url = "https://mcp.example.com/mcp"
# headers = { Authorization = "Bearer <token>" }

# ── Agnes 媒体配置（A-088 事故恢复：显式配置优于代码默认；无明文凭据）──

[media]
env_key = "HERMES_CUSTOM_API_AGNES_AI_CN_API_KEY"
api_base = "https://api.agnes-ai.cn/v1"
poll_base = "https://api.agnes-ai.cn/agnesapi"
image_model = "agnes-image-2.1-flash"
video_model = "agnes-video-v2.0"


# ── Soul-Plan：情绪进化软开关（docs/soul-plan.md 修正条 3）──
[emotion]
ab_enabled = true          # A/B 影子模式
ab_report_after = 50       # 每 Agent 满 50 次交互出对比报告
tool_signal = true         # 环2 工具成败 → 情绪（默认开，可单独关）
behavior_levers = true     # 三杠杆 + promote（默认开，可单独关）

# ── 自动更新 ──────────────────────────────────────────────
# enabled=false（默认）：不发起任何网络请求，状态面板显示"自动更新未启用"，
#   避免无发布源时反复报"检查失败: net::ERR_CONNECTION_CLOSED"。
# 启用方式：enabled = true，并填写 feed_url（electron-updater 的 generic feed，
#   指向发布 latest.yml 的目录，如 https://example.com/slime/releases/）。
# 留空 feed_url 时回退 electron-builder publish 字段（github provider）。

[update]
enabled = false
feed_url = ""

# ── SILAM 自研离线大脑（A-962：随包 sidecar/ + models/ 资产；exe 同级定位）──
# 随发行版内置：情感脑 backbone_80m.npz + 对话脑 lang_core_d16.npz + 词表 vocab.v3.1-6921.json，
# 位于安装根 models/ 与 configs/（extraFiles 自带，首启无需下载）。
# 成长脑持久化于用户数据目录 ~/.slimeagent/silam-default/brain/（启动自动恢复，群聊/对话自动观察落盘）。

[silam]
enabled = true
as_brain = true
agent_id = "silam-default"